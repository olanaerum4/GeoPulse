<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1020}
body{font-family:"Inter Display",Inter,Outfit,system-ui,sans-serif;color:#f1f5f9}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute;left:0;right:0;text-align:center}
.grad{background:linear-gradient(90deg,#22d3ee,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{background:linear-gradient(180deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{top:120px;display:flex;justify-content:center}
.brand span{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);padding:12px 30px 12px 14px;border-radius:99px;font-size:36px;font-weight:800}
.brand img{width:50px;height:50px;border-radius:14px}
.head{top:215px;font-size:62px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.rank{top:330px;font-size:230px;font-weight:900;line-height:1;letter-spacing:-.04em}
.flag{top:590px;font-size:300px;line-height:1}
.nm{top:930px;font-size:100px;font-weight:900;line-height:1;padding:0 60px}
.val{top:1055px;font-size:96px;font-weight:900;font-variant-numeric:tabular-nums}
.val small{font-size:46px;color:#94a3b8;margin-left:12px;font-weight:700}
.rows{top:1215px;display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;align-items:center;gap:22px;width:840px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);border-radius:26px;padding:12px 30px;font-size:46px;font-weight:800}
.row .r{width:90px;color:#94a3b8}.row .f{font-size:58px;line-height:1}.row .n{flex:1;text-align:left}.row .v{color:#22d3ee;font-variant-numeric:tabular-nums}
.fact{top:1215px;padding:0 110px;font-size:50px;font-weight:700;color:#e2e8f0;line-height:1.25}
.fact b{color:#fde68a}
.hook{top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:0 70px}
.tag{background:#e11d48;color:#fff;font-size:56px;font-weight:900;padding:16px 44px;border-radius:22px;letter-spacing:.06em;box-shadow:0 20px 60px -15px rgba(225,29,72,.8)}
.hook h1{font-size:120px;font-weight:900;line-height:1;letter-spacing:-.02em}
.hook p{font-size:60px;font-weight:800;color:#fde68a}
.blurflags{display:flex;gap:26px;font-size:130px;line-height:1;filter:blur(12px) saturate(1.3)}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none}
.p{position:absolute;width:26px;height:26px;border-radius:6px}
.icon{width:240px;height:240px;border-radius:60px}
.cta{background:linear-gradient(90deg,#0891b2,#6366f1);padding:34px 70px;border-radius:99px;font-size:62px;font-weight:900;box-shadow:0 30px 80px -20px rgba(99,102,241,.7)}
</style></head>
<body><div id="st"></div>
<script>
/* ---------- Fast-cut "Top 5" countdown. Edit CONFIG or render with a JSON config. ---------- */
let CONFIG={
 head:"Most islands 🏝️",
 hook:{tag:"TOP 5",title:'Countries with the <span class="grad">most islands</span>',sub:"#1 is NOT who you think 😳"},
 items:[ // #1 first
  {f:"🇸🇪",n:"Sweden",v:267570},{f:"🇳🇴",n:"Norway",v:239057},{f:"🇫🇮",n:"Finland",v:178947},{f:"🇨🇦",n:"Canada",v:52455},{f:"🇺🇸",n:"USA",v:18617}],
 unit:"",dec:0,
 fact:"Only about <b>1,000</b> of Sweden's islands are inhabited.",
 outro:{title:"Did you guess #1? 👇",cta:"Play free · geowawe.org"}
};
const HOOK=1.6,ITEM=1.4,SUS=1.0,ONE=2.7,OUT=1.8;
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmt=(v,d)=>v.toLocaleString("en-US",{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const HUES=[262,200,330,160,20];
function T(){const n=CONFIG.items.length-1;return{n,items0:HOOK,sus0:HOOK+n*ITEM,one0:HOOK+n*ITEM+SUS,out0:HOOK+n*ITEM+SUS+ONE,end:HOOK+n*ITEM+SUS+ONE+OUT}}
function duration(){return T().end}
function events(){const t=T(),e=[{t:0,s:"hit"},{t:0,s:"whoosh",v:.6}];
 for(let i=0;i<t.n;i++){const s=t.items0+i*ITEM;e.push({t:s,s:"kick"},{t:s,s:"whoosh",v:.7},{t:s+.2,s:"tick",v:.5})}
 e.push({t:t.sus0,s:"kick"},{t:t.sus0,s:"riser"});[0,.3,.5,.65,.77,.86,.93].forEach(x=>e.push({t:t.sus0+x,s:"tick",v:.8}));
 e.push({t:t.one0,s:"hit"},{t:t.one0+.05,s:"ding"},{t:t.out0,s:"kick"},{t:t.out0,s:"whoosh",v:.6});
 for(let x=HOOK;x<t.out0;x+=.25)e.push({t:x,s:"hat",v:.35});return e}
function cnt(v,e){const vs=CONFIG.items.map(i=>i.v),mx=Math.max(...vs),mn=Math.min(...vs),b=mx/mn<1.6?mn*.9:0;return b+(v-b)*e}
function bg(h,pulse){return`radial-gradient(circle at 50% 35%,hsl(${h} 70% ${24+pulse*10}%),#0b1020 70%)`}
function brand(){return`<div class="abs brand"><span><img src="../icon.svg">GeoWawe</span></div>`}
function flash(a){return a>0?`<div class="flash" style="opacity:${a}"></div>`:""}
function rnd(i){const x=Math.sin(i*999.13)*43758.5453;return x-Math.floor(x)}
function render(t){
 const st=document.getElementById("st"),C=CONFIG,tm=T();
 if(t<tm.items0){const u=t,shake=Math.sin(u*45)*Math.exp(-u*6)*14,pn=1+.14*Math.exp(-u*8)*Math.cos(u*25);
  st.style.background=bg(350,.3+.3*Math.abs(Math.sin(u*8)));
  st.innerHTML=brand()+`<div class="abs hook"><div class="tag" style="transform:rotate(-3deg) scale(${1+.07*Math.sin(u*14)})">${C.hook.tag}</div><h1 style="transform:translateX(${shake}px) scale(${pn})">${C.hook.title}</h1><div class="blurflags">${[...C.items].sort((a,b)=>a.n.localeCompare(b.n)).map(i=>`<span>${i.f}</span>`).join("")}</div><p>${C.hook.sub}</p></div>`;return}
 if(t<tm.sus0){const k=Math.floor((t-tm.items0)/ITEM),u=t-tm.items0-k*ITEM,idx=tm.n-k,it=C.items[idx],rank=idx+1;
  st.style.background=bg(HUES[k%HUES.length],0);
  const whip=(1-ease(u/.12))*900,blur=(1-ease(u/.12))*18,sh=Math.sin(u*60)*Math.exp(-u*12)*16;
  const rows=C.items.slice(idx+1).reverse().map((r,j)=>`<div class="row"><span class="r">#${C.items.indexOf(r)+1}</span><span class="f">${r.f}</span><span class="n">${r.n}</span><span class="v">${fmt(r.v,C.dec)}</span></div>`).join("");
  st.innerHTML=brand()+`<div class="abs head grad">${C.head}</div>`+
   `<div style="position:absolute;inset:0;transform:translate(${whip+sh}px,0);filter:blur(${blur}px)">`+
   `<div class="abs rank" style="transform:scale(${1+1.2*(1-ease(u/.14))})">#${rank}</div>`+
   `<div class="abs flag" style="transform:scale(${back((u-.04)/.22)}) rotate(${(1-ease(u/.3))*-12}deg)">${it.f}</div>`+
   `<div class="abs nm" style="opacity:${ease((u-.08)/.1)}">${it.n}</div>`+
   `<div class="abs val grad">${fmt(cnt(it.v,ease((u-.12)/.38)),C.dec)}${C.unit?`<small>${C.unit}</small>`:""}</div></div>`+
   `<div class="abs rows">${rows}</div>`+flash(1-u/.09);return}
 if(t<tm.one0){const u=t-tm.sus0,sh=Math.sin(u*70)*(4+u*14);
  st.style.background=bg(0,.2+.4*Math.abs(Math.sin(u*(6+u*14))));
  const rows=C.items.slice(1).reverse().map(r=>`<div class="row"><span class="r">#${C.items.indexOf(r)+1}</span><span class="f">${r.f}</span><span class="n">${r.n}</span><span class="v">${fmt(r.v,C.dec)}</span></div>`).join("");
  st.innerHTML=brand()+`<div class="abs head grad">${C.head}</div><div class="abs rank gold" style="top:420px;transform:translateX(${sh}px) scale(${1+u*.25})">#1 is…</div><div class="abs flag" style="top:660px;font-size:280px;filter:brightness(0) blur(${6-u*4}px);opacity:.9;transform:scale(${1+.06*Math.sin(u*30)})">${C.items[0].f}</div><div class="abs rows">${rows}</div>`+flash(1-u/.07);return}
 if(t<tm.out0){const u=t-tm.one0,it=C.items[0],sh=Math.sin(u*50)*Math.exp(-u*7)*24;
  st.style.background=bg(45,.25*Math.exp(-u*2));
  let ps="";for(let i=0;i<46;i++){const a=rnd(i)*Math.PI*2,sp=500+rnd(i+50)*900,d=ease(u/1.2)*sp,g=u*u*500;
   ps+=`<div class="p" style="left:${540+Math.cos(a)*d}px;top:${760+Math.sin(a)*d+g}px;background:hsl(${rnd(i+9)*360} 90% 60%);opacity:${1-clamp((u-.6)/.8)};transform:rotate(${u*600*rnd(i+3)}deg)"></div>`}
  st.innerHTML=brand()+`<div class="abs head grad">${C.head}</div><div style="position:absolute;inset:0;transform:translateX(${sh}px)">`+
   `<div class="abs rank gold" style="transform:scale(${1+1.4*(1-ease(u/.16))})">#1</div>`+
   `<div class="abs flag" style="transform:scale(${1.12*back((u-.03)/.3)})">${it.f}</div>`+
   `<div class="abs nm">${it.n}</div><div class="abs val gold">${fmt(cnt(it.v,ease((u-.1)/.55)),C.dec)}${C.unit?`<small>${C.unit}</small>`:""}</div>`+
   `<div class="abs fact" style="opacity:${ease((u-.7)/.3)};transform:translateY(${(1-ease((u-.7)/.3))*30}px)">😳 ${C.fact}</div></div>`+ps+flash(1-u/.1);return}
 const u=t-tm.out0,O=C.outro;st.style.background=bg(230,.15);
 st.innerHTML=brand()+`<div class="abs hook"><h1 style="font-size:110px;transform:scale(${back(u/.3)})">${O.title}</h1><img class="icon" src="../icon.svg" style="transform:scale(${back((u-.2)/.3)})"><div class="cta" style="transform:scale(${(1+.04*Math.sin(u*9))*back((u-.35)/.3)})">${O.cta}</div></div>`+flash(1-u/.07);
}
window.ready=Promise.resolve().then(()=>{render(0);return{duration:duration(),events:events()}});
</script></body></html>
